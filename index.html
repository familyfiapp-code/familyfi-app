<style>
/* Layout: sticky header + month stepper, scrollable tab strip, single column of panels that splits to two columns on wide screens */
:root{
  --bg:#f3f6f5; --panel:#ffffff; --ink:#132321; --muted:#5b6c69; --line:#d9e2df; --chip:#eaf0ee;
  --accent:#0d6b61; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --inc:#1d7a4c; --exp:#c0532f; --sav:#2c5db0; --warn:#a86a12; --bad:#b42318; --ok:#1d7a4c; --c6:#7a5cb8; --c7:#2f8fa6; --c8:#9c7a2e;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1514; --panel:#162120; --ink:#e4eeeb; --muted:#97aaa6; --line:#283634; --chip:#1e2b29;
  --accent:#4cbcae; --accent-ink:#06201d; --accent-soft:#183531;
  --inc:#5bc58d; --exp:#f08b64; --sav:#82a8f3; --warn:#e2b04a; --bad:#f07b6f; --ok:#5bc58d; --c6:#ae95ea; --c7:#5cc2d8; --c8:#d4b066; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1514; --panel:#162120; --ink:#e4eeeb; --muted:#97aaa6; --line:#283634; --chip:#1e2b29;
  --accent:#4cbcae; --accent-ink:#06201d; --accent-soft:#183531;
  --inc:#5bc58d; --exp:#f08b64; --sav:#82a8f3; --warn:#e2b04a; --bad:#f07b6f; --ok:#5bc58d; --c6:#ae95ea; --c7:#5cc2d8; --c8:#d4b066; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:2400px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:16px;line-height:1}
.stepper button:hover{background:var(--chip)}
.stepper select{border:0;background:transparent;padding:6px 4px;font-weight:600;cursor:pointer}
.save{font-size:12px;color:var(--muted);min-width:70px;text-align:right}
.save.err{color:var(--bad)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}/* fit-v1 */@media (min-width:1400px){.wrap{padding-left:max(32px,2.2vw,env(safe-area-inset-left,0px));padding-right:max(32px,2.2vw,env(safe-area-inset-right,0px))}}@media (min-width:700px){nav.tabs{flex-wrap:wrap;overflow-x:visible;row-gap:6px}}@media (max-width:699px){nav.tabs{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent 100%);padding-inline:2px 24px}}body{overflow-x:clip}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--chip)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--exp);color:#fff;font-size:11px;text-align:center}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:16px}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lbl i{width:8px;height:8px;border-radius:2px;display:inline-block}
.kpi .val{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .meta{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.up-bad{color:var(--bad)} .up-good{color:var(--ok)}
.meter{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:6px}
.meter>span{display:block;height:100%;background:var(--accent)}
.meter>span.over{background:var(--bad)}
.chart{position:relative;height:280px}
.chart.tall{height:360px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--chip)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.field input,.field select,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--ink);font-weight:400;min-width:0}
.inp.sm{padding:4px 6px;font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;align-items:end}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--line)}
.alert.warn{background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;white-space:nowrap}
td.r,th.r{text-align:right}
td.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.out{color:var(--exp)} .in{color:var(--inc)}
.desc{max-width:420px;word-break:break-word}
.desc small{display:block;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;max-width:240px;text-align:left}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip em{font-style:normal;color:var(--muted);font-size:11px;white-space:nowrap}
.chip.none{border-style:dashed;background:transparent;color:var(--exp);font-weight:600}
.chip.sg{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--panel))}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:var(--ok)}
.pill.due{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,var(--panel));color:var(--bad)}
.pill.open{background:var(--chip);color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .k{display:flex;flex-direction:column;min-width:0}
.li .k small{color:var(--muted);font-size:12px}
.tag-grp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
/* budget grid */
.bgrid{font-size:13px}
.bgrid th:first-child,.bgrid td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:170px;max-width:200px}
.bgrid input{width:84px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 5px;font-variant-numeric:tabular-nums}
.bgrid input:hover{border-color:var(--line)}
.bgrid input:focus{border-color:var(--accent);background:var(--bg)}
.bgrid td{padding:3px 4px;white-space:nowrap}
.bgrid tr.cat td{background:var(--chip);font-weight:700}
.bgrid tr.cat td:first-child{background:var(--chip)}
.bgrid tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.bgrid .cur{background:var(--accent-soft)}
.bgrid tr.cur td{background:var(--accent-soft)}
.heat td.hm{cursor:pointer;min-width:58px;font-size:12px}
.heat td.hm:hover{outline:1px solid var(--ink);outline-offset:-1px}
.bgrid td.v{text-align:right;padding-right:9px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.steps b{color:var(--ink)}
tr.dup td{opacity:.55}
.swap{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 4px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--panel);width:min(560px,100%);max-height:86vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));gap:10px}
@media(min-width:700px){.sheet{border-radius:14px}}
.sheet .opts{overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:120px}
.sheet .opt{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sheet .opt:hover,.sheet .opt.hl{background:var(--chip)}
.sheet .opt em{font-style:normal;color:var(--muted);font-size:12px}
.sheet .og{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 10px 2px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:30;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
details>summary{cursor:pointer;font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero-main{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:22px 24px;min-width:0}
.hero-main .btn{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 45%,transparent)}
.hero-main .btn:hover{background:color-mix(in srgb,var(--accent-ink) 14%,transparent)}
.hero-main .btn.pri{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.hero-hi{font-family:var(--f-display);font-size:16px;font-weight:500;opacity:.9}
.hero-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin-top:10px}
.hero-val{font-family:var(--f-display);font-size:clamp(34px,6vw,52px);font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-sub{font-size:13px;opacity:.85;margin-top:4px}
.hero-month{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-month .hero-lbl{opacity:1;color:var(--muted);margin:0 0 4px}
.hero-month .hero-sub{color:var(--muted);opacity:1}
.hm-row{display:grid;grid-template-columns:1fr auto 70px;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.hm-row span i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px}
.hm-row b{font-family:var(--f-display);font-size:18px}
.hm-row small{text-align:right;font-size:11.5px}
.att{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px}
.att-item{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.att-item:hover{border-color:var(--accent)}
.att-item .k{flex:1;min-width:0;display:flex;flex-direction:column}
.att-item .k small{color:var(--muted)}
.hico{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);flex:none}
.hico.sm{width:32px;height:32px}
.hico.sm svg{width:18px;height:18px}
.tgroup{display:flex;flex-direction:column;gap:10px}
.tgroup-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.tiles{gap:8px}.tile{padding:12px}.tile-val{font-size:19px}.hico{width:34px;height:34px}.tile-title{font-size:14.5px}}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s;min-width:0}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.tile-title{font-family:var(--f-display);font-weight:700;font-size:16px}
.tile-sub{font-size:12.5px;color:var(--muted)}
.tile-val{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:10px;letter-spacing:-.01em}
.tile-cap{font-size:12px;color:var(--muted)}
.tile-go{position:absolute;right:16px;bottom:14px;font-size:12px;font-weight:700;color:var(--accent);opacity:0;transition:opacity .15s}
.tile:hover .tile-go,.tile:focus-visible .tile-go{opacity:1}
.brand{cursor:pointer}
@media (prefers-reduced-motion:reduce){.tile:hover{transform:none}}
@media (max-width:720px){
  .kpi .val{font-size:24px}
  table.tx thead{display:none}
  table.tx,table.tx tbody,table.tx tr,table.tx td{display:block;width:100%}
  table.tx tr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.tx td{border:0;padding:0}
  table.tx td.c-chk{grid-row:1/span 3;padding-top:2px}
  table.tx td.c-date{grid-column:2;font-size:12px;color:var(--muted)}
  table.tx td.c-desc{grid-column:2/span 2;max-width:none}
  table.tx td.c-amt{grid-column:3;grid-row:1;text-align:right}
  table.tx td.c-amt.empty{display:none}
  table.tx td.c-led{grid-column:2}
  table.tx td.c-act{grid-column:3;grid-row:3;text-align:right}
  table.tx td.c-acc{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* owner footer, lock screen, encryption, owner console */
.ofoot{margin:28px auto 0;padding-top:14px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);text-align:center;font-size:12px;line-height:1.6;color:var(--muted)}
.ofoot b{color:var(--ink)}
.ofoot-lic{margin-top:2px;font-weight:600;color:var(--accent)}
.lockwrap{display:flex;justify-content:center;padding:6vh 0 4vh}
.lockbox{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;padding:28px 24px}
.lockbox .btn{justify-content:center;text-align:center}
.lockbox h2{margin:0}.lockbox .sub,.lockbox .small{margin:0}
.lockbox .small{font-size:12px;color:var(--muted)}
.lock-ico{display:flex;justify-content:center;color:var(--accent)}
.lockbox .inp{font-size:16px;padding:11px 12px;text-align:center}
.lock-err{color:var(--bad);font-size:13px;font-weight:600}
.rcode{font-family:ui-monospace,Consolas,monospace;font-size:clamp(16px,4.4vw,22px);letter-spacing:.06em;font-weight:700;background:var(--panel);border:1px dashed var(--accent);border-radius:10px;padding:12px;text-align:center;user-select:all;word-break:break-all}
.encbox{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;max-width:520px}
.encrow{display:flex;gap:8px;flex-wrap:wrap}.encrow .inp{flex:1 1 200px}
table.kv{border-collapse:collapse;width:100%;font-size:14px}
table.kv th{text-align:left;color:var(--muted);font-weight:600;padding:6px 12px 6px 0;width:38%;vertical-align:top;border-bottom:1px solid var(--line)}
table.kv td{padding:6px 0;border-bottom:1px solid var(--line)}
table.atbl{border-collapse:collapse;width:100%;font-size:13.5px}
table.atbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.atbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
/* live prices */
.lvtag{font-size:11.5px;color:var(--ok);font-weight:600;margin-top:2px}
.lvtag.off{color:var(--muted);font-weight:500}.lvtag.bad{color:var(--bad)}
.lvlink{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.lvrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lvsearch{flex:1 1 360px;min-width:0}.lvsearch .inp{flex:1;min-width:0}
.lvopts{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:320px;overflow:auto}
.lvopt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:8px 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;color:var(--ink);font:inherit;font-size:13.5px}
.lvopt:hover{border-color:var(--accent)}
.inp.ro{background:transparent;border-style:dashed;color:var(--ink);min-height:36px;display:flex;align-items:center}
.lkwrap{display:flex;flex-direction:column;gap:4px}.lkst{font-weight:400}
